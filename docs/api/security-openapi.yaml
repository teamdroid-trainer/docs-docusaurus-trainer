openapi: 3.0.3
info:
  title: Security Microservice API
  description: "API de seguridad, gestión de usuarios, login y MFA."
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Servidor de Desarrollo Local
paths:
  /api/v1/auth/login:
    post:
      tags:
        - Autenticación
      summary: "Iniciar sesión de usuario"
      description: "Valida credenciales y retorna un access_token o un mfa_token si corresponde."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: "Login exitoso o confirmación de requerimiento MFA"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: "Credenciales inválidas"
components:
  schemas:
    LoginRequest:
      description: "Payload para iniciar sesión"
      type: object
      required:
        - password
        - username
      properties:
        username:
          description: "El nombre de usuario o email"
          type: string
          example: "user"
        password:
          description: "Contraseña en texto plano"
          minLength: 8
          type: string
          example: "password123"
    LoginResponse:
      type: object
      properties:
        username:
          type: string
        accessToken:
          type: string